name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build devkitPro image
        run: docker build -t bloopair-devkitpro .
      - name: Build binary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace/Bloopair" \
            -w /workspace/Bloopair \
            bloopair-devkitpro \
            sh -lc 'git config --global --add safe.directory /workspace/Bloopair && make dist'
      - uses: actions/upload-artifact@v7
        with:
          name: Bloopair_nightly
          path: dist/*
