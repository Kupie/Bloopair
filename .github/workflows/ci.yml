name: Build Bloopair

on:
  push:
    branches:
      - gpt_test
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dist
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace/Bloopair" \
            -w /workspace/Bloopair \
            devkitpro/devkitppc:20260221 \
            sh -lc '
              git config --global --add safe.directory /workspace/Bloopair
              export DEVKITPRO=/opt/devkitpro
              export DEVKITPPC=/opt/devkitpro/devkitPPC
              export DEVKITARM=/opt/devkitpro/devkitARM
              export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/devkitARM/bin:$PATH
              make dist
            '

      - name: List dist output
        run: find dist -maxdepth 5 -type f -print

      - name: Upload Bloopair artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloopair-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
