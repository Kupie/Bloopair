name: Build Bloopair

on:
  push:
    branches:
      - gpt_test
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build devkitPro Docker image
        run: docker build -t bloopair-devkitpro .

      - name: Build dist
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace/Bloopair" \
            -w /workspace/Bloopair \
            bloopair-devkitpro \
            sh -lc 'git config --global --add safe.directory /workspace/Bloopair && make dist'

      - name: List dist output
        run: find dist -maxdepth 5 -type f -print

      - name: Upload Bloopair artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloopair-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
